# Fydelis NetBeans Framework — Propriedades do Projeto
# Compatível com NetBeans 31 / JDK 26+
# === Identificação ===
application.title=Fydelis NetBeans Framework
dist.name=fydelis-netbeans-framework
version=1.0.0
code.name.base=br.com.fydelis.netbeans

# === Caminhos de código ===
src.dir=src
test.src.dir=test
build.dir=build
dist.dir=dist
release.dir=release

# === Compilação ===
javac.source=26
javac.target=26
javac.debug=true
javac.deprecation=false
build.compiler=modern
encoding=UTF-8

# === Módulo NetBeans — Metadados ===
nbm.homepage=https://github.com/fydelis2025/fydelis-netbeans-framework
nbm.vendor=Fydelis
nbm.license=MIT
nbm.description=Ecossistema Qt/C++ — migração Qt5→Qt6, validação e suporte a projetos.

# === Arquivos essenciais ===
manifest.file=nbproject/manifest.mf
layer.xml=nbproject/layer.xml

# ✅ TORNA TODOS OS PACOTES VISÍVEIS
public.packages=\
  br.com.fydelis.netbeans.*,\
  br.com.fydelis.netbeans.actions.*,\
  br.com.fydelis.netbeans.core.*,\
  br.com.fydelis.netbeans.validator.*,\
  br.com.fydelis.netbeans.migration.*

# === Plataforma ===
platform.active=default
harness.dir=${nbplatform.default.harness.dir}
nbplatform.default.name=default
nbplatform.default.harness.dir=${netbeans.home}/harness
nbplatform.default.nbjavac.dir=${netbeans.home}/nbjavac
nbplatform.default.nbplatform.jar=${netbeans.home}/lib/nbplatform.jar

# === Dependências do sistema ===
modules.common=${harness.dir}/modules
apisupport.harness.classpath=\
    ${modules.common}/org-netbeans-modules-apisupport-harness.jar:\
    ${modules.common}/org-netbeans-modules-apisupport-project.jar

# === Exclusões ===
build.classes.exclude=**/*.java
define.spec.version.base.fatal.warning=false